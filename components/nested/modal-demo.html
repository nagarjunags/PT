<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Modal Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #e2e8f0;
      padding: 32px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      font-size: 12px;
      background: #4f46e5;
      color: white;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .trigger-btn {
      padding: 12px 24px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="badge">Nested Folder: components/nested/</div>
  <h1>Nested Hierarchy Example</h1>
  <p style="color: #94a3b8; margin: 12px 0 24px;">This file demonstrates that deep subfolders are correctly rendered as nested trees.</p>
  <button class="trigger-btn" onclick="openModal()">Open Sample Modal</button>

  <div id="modal" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h3 style="margin-bottom: 8px;">Nested Component Modal</h3>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">
        Everything is running smoothly inside this standalone HTML iframe preview!
      </p>
      <button class="trigger-btn" style="background: #334155;" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
