<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Components</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      padding: 32px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #9ca3af; margin-bottom: 24px; font-size: 14px; }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #374151; color: white; border-color: #4b5563; }
    .btn-secondary:hover { background: #4b5563; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .click-counter {
      margin-top: 24px;
      padding: 16px;
      background: #1f2937;
      border-radius: 8px;
      border: 1px solid #374151;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>Interactive UI Components</h1>
  <p>Example located in <code>components/buttons.html</code></p>

  <div class="btn-group">
    <button class="btn-primary" onclick="handleClick('Primary')">Primary Action</button>
    <button class="btn-secondary" onclick="handleClick('Secondary')">Secondary</button>
    <button class="btn-success" onclick="handleClick('Success')">Save & Publish</button>
    <button class="btn-danger" onclick="handleClick('Delete')">Delete Item</button>
  </div>

  <div class="click-counter" id="status">
    Clicked: None yet. Try clicking any button above!
  </div>

  <script>
    let count = 0;
    function handleClick(name) {
      count++;
      document.getElementById('status').innerText = `Clicked: ${name} (${count} clicks total)`;
    }
  </script>
</body>
</html>
