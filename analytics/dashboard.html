<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #818cf8;
      --success: #34d399;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px;
    }
    .header {
      margin-bottom: 28px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      margin-bottom: 8px;
    }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { color: var(--text-muted); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }
    .card-title { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .card-change { font-size: 12px; color: var(--success); font-weight: 500; }
    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .chart-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .bars {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 140px;
      padding-top: 10px;
      border-bottom: 1px solid var(--border);
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      height: 100%;
      justify-content: flex-end;
    }
    .bar {
      width: 100%;
      max-width: 38px;
      background: linear-gradient(180deg, var(--primary), var(--accent));
      border-radius: 6px 6px 0 0;
      transition: height 0.4s ease;
    }
    .bar-label { font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">Standalone Sample File</span>
    <h1>Analytics Overview</h1>
    <p class="subtitle">This is an example standalone HTML file located in <code>analytics/dashboard.html</code>.</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-title">Total Page Views</div>
      <div class="card-value">124,582</div>
      <div class="card-change">↑ +14.6% vs last week</div>
    </div>
    <div class="card">
      <div class="card-title">Active Users</div>
      <div class="card-value">8,920</div>
      <div class="card-change">↑ +8.2% vs last week</div>
    </div>
    <div class="card">
      <div class="card-title">Bounce Rate</div>
      <div class="card-value">24.3%</div>
      <div class="card-change" style="color: var(--primary);">↓ -2.1% improvement</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">Weekly Activity</div>
    <div class="bars">
      <div class="bar-col"><div class="bar" style="height: 45%;"></div><span class="bar-label">Mon</span></div>
      <div class="bar-col"><div class="bar" style="height: 60%;"></div><span class="bar-label">Tue</span></div>
      <div class="bar-col"><div class="bar" style="height: 85%;"></div><span class="bar-label">Wed</span></div>
      <div class="bar-col"><div class="bar" style="height: 70%;"></div><span class="bar-label">Thu</span></div>
      <div class="bar-col"><div class="bar" style="height: 95%;"></div><span class="bar-label">Fri</span></div>
      <div class="bar-col"><div class="bar" style="height: 50%;"></div><span class="bar-label">Sat</span></div>
      <div class="bar-col"><div class="bar" style="height: 40%;"></div><span class="bar-label">Sun</span></div>
    </div>
  </div>
</body>
</html>
